<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>장학생 관리</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#3b3a6b">
<style>
:root{--ink:#1f2433;--muted:#5d6475;--line:#e1e3ea;--bg:#f5f6f9;--card:#fff;--accent:#4b4a8c;--accent-soft:#ecebf7;--side:#2f2e5a;--side-txt:#eceaf8;--side-muted:#b4b1d6;--side-line:#45437a;--danger:#b42318;--ok:#1a7f4b;--warn:#b54708}
*{box-sizing:border-box}
body{margin:0;font:14px/1.5 -apple-system,"Apple SD Gothic Neo","Malgun Gothic",system-ui,"Segoe UI",Roboto,Arial,sans-serif;color:var(--ink);background:var(--bg)}
.app{display:flex;min-height:100vh}
nav.side{width:220px;background:var(--side);color:var(--side-txt);flex-shrink:0;padding:10px 0;position:sticky;top:0;height:100vh;overflow:auto}
.brand{padding:10px 18px 14px;font-weight:700;font-size:16px;border-bottom:1px solid var(--side-line);margin-bottom:6px}
nav.side a{display:flex;align-items:center;gap:10px;margin:1px 10px;padding:0 12px;min-height:40px;border-radius:8px;color:var(--side-txt);text-decoration:none;cursor:pointer}
nav.side a:hover{background:rgba(255,255,255,.08)}nav.side a.active{background:var(--accent);color:#fff;font-weight:600}
.yearsel{padding:8px 18px 10px}.yearsel label{font-size:12px;color:var(--side-muted);display:block;margin-bottom:3px}.yearsel select{width:100%;color:#1f2433}
nav.side .foot{padding:12px 18px;border-top:1px solid var(--side-line);margin-top:10px;font-size:12px;color:var(--side-muted)}
nav.side .foot button{width:100%;margin-top:6px;background:rgba(255,255,255,.1);color:#fff;border-color:rgba(255,255,255,.22)}
main{flex:1;padding:20px 26px;min-width:0;max-width:1180px}
h1{font-size:21px;margin:0}h2{font-size:16px;margin:0 0 10px}h3{font-size:14px;margin:0 0 6px}
.hd{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin:0 0 14px}.hp{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.field{display:flex;flex-direction:column;gap:3px;min-width:150px}.field label{font-size:12px;color:var(--muted)}
input,select,textarea{font:inherit;padding:6px 8px;border:1px solid #c7cbd6;border-radius:6px;background:#fff;color:inherit}
textarea{min-height:72px;width:100%;resize:vertical}
button,.btn{font:inherit;padding:7px 12px;border-radius:7px;border:1px solid #c7cbd6;background:#fff;cursor:pointer;color:inherit;display:inline-flex;align-items:center;gap:5px;text-decoration:none;white-space:nowrap}
button:hover,.btn:hover{border-color:#98a0b3}button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
button.danger{color:var(--danger);border-color:#f0b4ae}button.small,.btn.small{padding:3px 9px;font-size:12px}
button.link{border:0;background:none;color:var(--accent);padding:0;text-decoration:underline}

table.data{width:100%;border-collapse:collapse;background:#fff}
table.data th,table.data td{border-bottom:1px solid var(--line);padding:7px 9px;text-align:left;vertical-align:middle}

table.data tr.click{cursor:pointer}table.data tr.click:hover td{background:#f7f7fc}
.tag{display:inline-block;padding:1px 9px;border-radius:10px;font-size:12px;background:#eef0f4;margin:1px 3px 1px 0;white-space:nowrap}
.tag.ok{background:#e3f4ea;color:var(--ok)}.tag.warn{background:#fdf0e1;color:var(--warn)}.tag.bad{background:#fde8e6;color:var(--danger)}.tag.vi{background:var(--accent-soft);color:var(--accent)}
.muted{color:var(--muted)}.small{font-size:12px}
.banner{padding:10px 12px;border-radius:8px;margin-bottom:12px;background:#fff7e6;border:1px solid #f5d9a8}.banner.info{background:#eef2ff;border-color:#c7d0f5}
.ph{background:#e9ebf1;display:flex;align-items:center;justify-content:center;color:#9aa1b2;font-size:11px;text-align:center}
.thumb{width:40px;height:50px;border-radius:6px;object-fit:cover;display:flex}
.k{font-size:12px;color:var(--muted);margin-bottom:1px}
/* 홈 */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:14px}
.stat{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 16px}.stat .v{font-size:26px;font-weight:700}.stat .l{font-size:12.5px;color:var(--muted)}
.prog{margin-bottom:14px}.prog .bar{height:9px;background:#eceef3;border-radius:6px;overflow:hidden;margin:6px 0}.prog .bar i{display:block;height:100%;background:var(--accent)}
.prog .bar i.done{background:var(--ok)}
.todo{display:flex;flex-wrap:wrap;gap:5px}.todo a{font-size:12.5px;background:#f4f4f9;border-radius:12px;padding:2px 10px;cursor:pointer;color:inherit;text-decoration:none}.todo a:hover{background:var(--accent-soft)}
.steps{counter-reset:s;list-style:none;padding:0;margin:0}.steps li{counter-increment:s;padding:6px 0 6px 34px;position:relative}.steps li:before{content:counter(s);position:absolute;left:0;top:5px;width:24px;height:24px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font-weight:700;display:flex;align-items:center;justify-content:center;font-size:12px}
/* 학생 상세 */
.prof{display:flex;gap:22px;align-items:flex-start}
.pwrap{position:relative;flex:none;width:170px;height:215px}
.pphoto{width:170px;height:215px;object-fit:cover;border-radius:12px;display:flex}
.pinfo{flex:1;min-width:0}
.ptop{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:6px}.ptop h1{font-size:24px}
.pgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px 18px;margin-top:12px;padding-top:14px;border-top:1px solid var(--line)}.pgrid .w2{grid-column:span 2}.pgrid .w3{grid-column:1/-1}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:-4px -18px 16px;padding:0 18px;overflow-x:auto}
.tabs a{padding:9px 14px;cursor:pointer;border-bottom:2.5px solid transparent;font-weight:600;color:var(--muted);white-space:nowrap}.tabs a.on{color:var(--accent);border-bottom-color:var(--accent)}
.tabs a .dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-left:5px;vertical-align:middle}
.ygrid{display:grid;grid-template-columns:150px 1fr 230px;gap:20px}
.yphoto{width:150px;height:190px;object-fit:cover;border-radius:10px;display:flex}
.upl{position:relative;display:block;cursor:pointer}.upl .ov{position:absolute;left:0;right:0;bottom:0;background:rgba(20,20,40,.6);color:#fff;font-size:12px;text-align:center;padding:5px;border-radius:0 0 10px 10px;opacity:0;transition:.15s}.upl:hover .ov{opacity:1}
.dream{font-size:16px;font-weight:600;margin-bottom:12px}.pray{font-size:15px;line-height:1.65;border-left:3px solid var(--accent);padding:1px 0 1px 12px}
.side-box{border-left:1px solid var(--line);padding-left:18px}
.donrow{display:flex;justify-content:space-between;align-items:center;padding:7px 10px;border:1px solid var(--line);border-radius:8px;margin-bottom:6px;cursor:pointer}.donrow:hover{border-color:#a9a6d6;background:#fafaff}
.stline{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:14px;padding:8px 12px;border-radius:8px;background:#f7f8fb}
/* 후원자 상세 */
.kids{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.kid{display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:8px;cursor:pointer;background:#fff;position:relative}.kid:hover{border-color:#a9a6d6}
.kid .kim{width:52px;height:64px;border-radius:7px;object-fit:cover;flex:none;display:flex}
.kid .x{position:absolute;top:4px;right:6px;border:0;background:none;color:#9aa1b2;font-size:15px;padding:0 4px}.kid .x:hover{color:var(--danger)}
/* 모달 */
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px;margin-top:6px}
.gi{position:relative;cursor:pointer;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#f3f4f7}.gi:hover{border-color:#a9a6d6}
.gi img{width:100%;height:140px;object-fit:cover;display:block}.gdoc{height:140px;display:flex;align-items:center;justify-content:center;font-size:42px}
.glb{font-size:11.5px;padding:4px 7px;background:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-height:24px}
.gmain{position:absolute;top:6px;left:6px;background:var(--accent);color:#fff;font-size:11px;padding:1px 7px;border-radius:9px}
.modal-bg{position:fixed;inset:0;background:rgba(15,23,42,.45);display:flex;align-items:flex-start;justify-content:center;padding:30px 10px;overflow:auto;z-index:50}
.modal{background:#fff;border-radius:12px;padding:18px 20px;width:min(720px,100%);box-shadow:0 10px 40px rgba(0,0,0,.25)}.modal h3{font-size:17px;margin:0 0 12px}
.form-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px 14px}.form-grid .full{grid-column:1/-1}
.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
.chk{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:3px 12px;max-height:55vh;overflow:auto;border:1px solid var(--line);border-radius:8px;padding:8px}
.chk label{display:flex;gap:7px;align-items:center;padding:4px;border-radius:5px;cursor:pointer}.chk label:hover{background:#f4f4fa}
.toast{position:fixed;bottom:18px;right:18px;background:#1f2433;color:#fff;padding:10px 14px;border-radius:8px;z-index:60}
/* 감사카드 미리보기 */
.cards-pv{display:grid;grid-template-columns:repeat(auto-fill,minmax(420px,1fr));gap:14px}
.pv{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px}.pv canvas{width:100%;height:auto;border-radius:6px;display:block}
#print{display:none}
/* ---------- 출력물: 흑백 ---------- */
.pg{color:#000;background:#fff;font-size:12.5px;line-height:1.45}
.pg table{border-collapse:collapse;width:100%}.pg th,.pg td{border:1px solid #000;padding:5px 7px;text-align:left;vertical-align:top}.pg th{width:32mm}
.sheet-hd{display:flex;gap:7mm;align-items:flex-start;margin-bottom:6mm}.sheet-hd .pimg{width:35mm;height:45mm;object-fit:cover;border:1px solid #000;flex:none;display:flex;align-items:center;justify-content:center;font-size:10px}
.sheet-title{font-size:18px;font-weight:bold;margin:0 0 2mm}
.prc{width:180mm;height:122mm;border:1.2px solid #000;margin:0 auto 6mm;display:flex;align-items:center;justify-content:center}.prc img{max-width:100%;max-height:100%}
.fiche{height:127mm;padding:4mm 6mm;font-family:Arial,Helvetica,sans-serif;font-size:13px;color:#000;display:flex;flex-direction:column}
.fiche .ti{text-align:center;font-weight:bold;font-size:17px}.fiche .an{text-align:center;font-size:12px;margin-bottom:3mm;border-bottom:1.5px solid #000;padding-bottom:3mm}
.fiche .l{margin:2.2mm 0;display:flex;gap:2mm;align-items:baseline}.fiche .l .d{flex:1;border-bottom:1px dotted #000;min-height:5mm}.fiche .dl{border-bottom:1px dotted #000;height:7mm}
.cut{font-size:10px;border-top:1px dashed #000;margin:2mm 0;padding-top:1mm}
@media (max-width:860px){.app{flex-direction:column}nav.side{width:auto;height:auto;position:static;display:flex;flex-wrap:wrap;padding:6px;align-items:center}.brand{width:100%;border:0;margin:0;padding:6px 10px}nav.side a{padding:4px 10px;min-height:34px}.yearsel{padding:4px 10px}.yearsel label{display:none}nav.side .foot{display:none}main{padding:12px}
 .prof{flex-direction:column;align-items:center}.pgrid{grid-template-columns:1fr 1fr}.ygrid{grid-template-columns:1fr}.side-box{border:0;padding:0}.cards-pv{grid-template-columns:1fr}.hide-m{display:none}}
@media print{body{background:#fff}.app,.modal-bg,.toast{display:none!important}#print{display:block}@page{size:A4;margin:12mm}#print .pgb{page-break-after:always;break-after:page}#print .pgb:last-child{page-break-after:auto;break-after:auto}}
</style>

<body>
<div class="app"><nav class="side" id="nav"></nav><main id="main"></main></div>
<div id="print"></div>
<script>
'use strict';
/* =====================================================================
   장학생 관리
   자료: OneDrive 폴더의 bourses_donnees.json (+ photos/, fiches/, cartes/, sauvegardes/)
   구조: 학생(바뀌지 않는 정보) + 학생.ans[학년도](그해 명단·학교·학년·장래희망·기도제목·사진·카드)
         후원자 + 후원자.ans[학년도](감사카드 보낸 날)  /  liens: 학년도별 학생-후원자 연결
   ===================================================================== */
const APP_VERSION='7 (2026-11-20)';
const DATAFILE='bourses_donnees.json',KEY='bourses_db_v1';
const ST=['장학생','중단','졸업'];
const CLS=['PS','MS','GS','CP1','CP2','CE1','CE2','CM1','CM2','6ème','5ème','4ème','3ème','2nde','1ère','Tle'];
const NIV={PS:'유치원(소)',MS:'유치원(중)',GS:'유치원(대)',CP1:'초등 1학년',CP2:'초등 2학년',CE1:'초등 3학년',CE2:'초등 4학년',CM1:'초등 5학년',CM2:'초등 6학년','6ème':'중학교 1학년','5ème':'중학교 2학년','4ème':'중학교 3학년','3ème':'중학교 4학년','2nde':'고등학교 1학년','1ère':'고등학교 2학년','Tle':'고등학교 3학년'};
let MIGRATED=false,DB=null,DIR=null,DSTATE='none',DERR='',LASTMOD=0,DIRTY=false;
const UI={view:'eleves',id:null,annee:null,tab:null,f:{r:'cur',ec:'',q:''},df:'cur',cd:{don:'',ids:null}};

/* ---------- 도구 ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today=()=>new Date().toISOString().slice(0,10);
const fmtD=d=>d?d.slice(0,10).replace(/-/g,'.'):'';
const fmtFR=d=>{if(!d)return '';const [y,m,j]=d.split('-');return `${j}/${m}/${y}`};
function age(d){if(!d)return '';const b=new Date(d),n=new Date();let a=n.getFullYear()-b.getFullYear();if(n.getMonth()<b.getMonth()||(n.getMonth()===b.getMonth()&&n.getDate()<b.getDate()))a--;return a}
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2600)}
function download(name,data,type){const b=data instanceof Blob?data:new Blob([data],{type});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500)}
const cmpNom=(a,b)=>a.nom.localeCompare(b.nom,'fr');const cmpKo=(a,b)=>a.nom.localeCompare(b.nom,'ko');
function nivKo(c){if(!c)return '';const k=Object.keys(NIV).find(k=>k.toLowerCase()===String(c).trim().toLowerCase());return k?NIV[k]:''}
function nextCls(c){const i=CLS.findIndex(k=>k.toLowerCase()===String(c||'').trim().toLowerCase());return i>=0&&i<CLS.length-1?CLS[i+1]:''}
const clsLabel=c=>c?esc(c)+(nivKo(c)?` <span class="muted">· ${nivKo(c)}</span>`:''):'';

/* ---------- 자료 접근 ---------- */
const CUR=()=>DB.settings.annee;const A=()=>UI.annee||DB.settings.annee;
const elv=id=>DB.eleves.find(e=>e.id===id);const don=id=>DB.donateurs.find(d=>d.id===id);
const Y=(e,a=A())=>e.ans[a]||{};
const inR=(e,a=A())=>Y(e,a).st==='장학생';
const roster=(a=A())=>DB.eleves.filter(e=>inR(e,a)).sort(cmpNom);
const donsOf=(eid,a=A())=>DB.liens.filter(l=>l.annee===a&&l.eleve===eid).map(l=>don(l.donateur)).filter(Boolean).sort(cmpKo);
const kidsOf=(did,a=A())=>DB.liens.filter(l=>l.annee===a&&l.donateur===did).map(l=>elv(l.eleve)).filter(Boolean).sort(cmpNom);
const activeDons=(a=A())=>DB.donateurs.filter(d=>kidsOf(d.id,a).length).sort(cmpKo);
const annees=()=>{const s=new Set(DB.settings.annees);DB.eleves.forEach(e=>Object.keys(e.ans).forEach(a=>s.add(a)));return [...s].sort()};

const curEcole=e=>{const ys=Object.keys(e.ans).sort().reverse();for(const y of ys)if(e.ans[y].ecole)return e.ans[y].ecole;return ''};
function nextId(arr,p){let n=0;arr.forEach(x=>{const k=parseInt(String(x.id).slice(1),10);if(k>n)n=k});return p+String(n+1).padStart(3,'0')}
function logJ(m){DB.journal.push({at:new Date().toISOString(),msg:m});if(DB.journal.length>800)DB.journal=DB.journal.slice(-800)}
const cardDone=(e,a=A())=>!!(Y(e,a).projet&&Y(e,a).priere);
const isImg=f=>/\.(jpe?g|png|gif|webp|heic)$/i.test(f);
const sentOf=(d,a=A())=>d.ans?.[a]?.carte||'';

/* ---------- 자료 형식 (이전 형식 자동 변환) ---------- */
function emptyDB(){const n=new Date(),y=n.getMonth()>=7?n.getFullYear():n.getFullYear()-1,a=`${y}-${String(y+1).slice(2)}`;return {meta:{app:'bourses',format:3,rev:0,at:new Date().toISOString()},settings:{annee:a,annees:[a],cardTitle:'후원해 주셔서 감사합니다',cardFooter:'부르키나파소 보보디울라소에서',lastBackup:null},eleves:[],donateurs:[],liens:[],journal:[]}}
function migrate(d){
 d.meta=d.meta||{rev:0};d.settings=d.settings||{};d.journal=d.journal||[];
 if((d.meta.format||1)<2){
  const map={장학중:'장학생',중단:'중단',졸업:'졸업'};
  d.eleves=(d.eleves||[]).map(e=>{const ans={};const ys=new Set([...Object.keys(e.statut||{}),...Object.keys(e.annees||{})]);
   ys.forEach(y=>{const r=(e.annees||{})[y]||{};const st=map[(e.statut||{})[y]]||'';ans[y]=Object.assign({st,ecole:e.ecole||''},r);if(!ans[y].st)delete ans[y].st});
   return {id:e.id,nom:e.nom,sexe:e.sexe||'',naissance:e.naissance||'',pere:e.pere||'',mere:e.mere||'',tel:e.tel||'',memo:e.memo||'',drive:e.drive||'',ans}});
  d.liens=(d.matches||[]).map(m=>({annee:m.annee,eleve:m.eleve,donateur:m.donateur}));delete d.matches;
  const last=d.settings.annee;
  d.donateurs=(d.donateurs||[]).map(x=>({id:x.id,nom:x.nom,type:/교회|단체|WMC/.test(x.nom)?'교회·단체':'개인',contact:x.contact||'',cycle:x.cycle||'',montant:x.montant??null,devise:x.devise||'KRW',memo:x.memo||'',archive:(x.statut||{})[last]==='중단'&&!d.liens.some(l=>l.annee===last&&l.donateur===x.id),ans:{}}));
  delete d.settings.ecoles;d.meta.format=2;MIGRATED=true;d.journal.push({at:new Date().toISOString(),msg:'새 구조(형식 2)로 자동 변환'});
 }
 if(d.meta.format<3){
  (d.eleves||[]).forEach(e=>{e.galerie=e.galerie||[];let main='',mainY='';Object.keys(e.ans||{}).sort().forEach(y=>{const r=e.ans[y];
   if(r.photo){e.galerie.push({dir:'photos',f:r.photo,date:'',label:`${y} 사진`});if(y>=mainY){main=r.photo;mainY=y}delete r.photo}
   if(r.fiche){e.galerie.push({dir:'fiches',f:r.fiche,date:'',label:`${y} 카드`});delete r.fiche}});
   e.photo=e.photo||main});
  d.meta.format=3;MIGRATED=true;d.journal.push({at:new Date().toISOString(),msg:'새 구조(형식 3: 사진·자료 모음)로 자동 변환'});
 }
 d.settings.annees=d.settings.annees||[d.settings.annee];d.settings.cardTitle=d.settings.cardTitle??'후원해 주셔서 감사합니다';d.settings.cardFooter=d.settings.cardFooter??'부르키나파소 보보디울라소에서';

function idb(){return new Promise((res,rej)=>{const r=indexedDB.open('bourses_fichier',1);r.onupgradeneeded=()=>r.result.createObjectStore('h');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
async function idbGet(k){const d=await idb();return new Promise(r=>{const q=d.transaction('h').objectStore('h').get(k);q.onsuccess=()=>r(q.result);q.onerror=()=>r(null)})}
async function idbSet(k,v){const d=await idb();return new Promise(r=>{const t=d.transaction('h','readwrite');t.objectStore('h').put(v,k);t.oncomplete=()=>r()})}
const DIR_OK=typeof window.showDirectoryPicker==='function';
const saveLocal=()=>{try{localStorage.setItem(KEY,JSON.stringify(DB))}catch(e){}};
const fh=()=>DIR.getFileHandle(DATAFILE,{create:true});
async function readData(){const f=await (await fh()).getFile();LASTMOD=f.lastModified;const t=await f.text();if(!t.trim())return null;return migrate(JSON.parse(t))}
let saveT=null;
function save(msg){if(msg)logJ(msg);DB.meta.rev=(DB.meta.rev||0)+1;DB.meta.at=new Date().toISOString();DIRTY=true;saveLocal();clearTimeout(saveT);saveT=setTimeout(writeData,250);renderFoot()}
async function writeData(){
 if(!DIR||DSTATE!=='ok')return;
 try{const h=await fh(),f=await h.getFile();
  if(LASTMOD&&f.lastModified!==LASTMOD){let o=null;try{o=JSON.parse(await f.text())}catch(e){}
   if(o&&(o.meta?.rev||0)>=(DB.meta.rev||0)){await saveSub('sauvegardes',`충돌_이쪽내용_${today()}_${Date.now()}.json`,JSON.stringify(DB));DB=migrate(o);LASTMOD=f.lastModified;DIRTY=false;saveLocal();render();alert('다른 곳에서 자료 파일이 먼저 바뀌어 그 내용을 불러왔습니다.\n방금 고친 내용은 sauvegardes 폴더에 "충돌_…" 파일로 보관했습니다.');return}}
  const w=await h.createWritable();await w.write(JSON.stringify(DB));await w.close();LASTMOD=(await h.getFile()).lastModified;DIRTY=false;renderFoot();autoBackup();
 }catch(e){DSTATE='error';DERR=e.message;renderFoot()}
}
async function saveSub(dir,name,data){const d=await DIR.getDirectoryHandle(dir,{create:true});const w=await (await d.getFileHandle(name,{create:true})).createWritable();await w.write(data);await w.close()}
async function autoBackup(force){
 if(!DIR||DSTATE!=='ok')return;const lb=DB.settings.lastBackup;if(!force&&lb&&(Date.now()-new Date(lb).getTime())<6.5*864e5)return;
 try{const name=`bourses_sauvegarde_${today()}.json`;DB.settings.lastBackup=new Date().toISOString();await saveSub('sauvegardes',name,JSON.stringify(DB));
  const d=await DIR.getDirectoryHandle('sauvegardes');const ns=[];for await(const [n] of d.entries())if(/^bourses_sauvegarde_\d{4}-\d{2}-\d{2}\.json$/.test(n))ns.push(n);ns.sort();while(ns.length>30){try{await d.removeEntry(ns.shift())}catch(e){}}
  saveLocal();const h=await fh();const w=await h.createWritable();await w.write(JSON.stringify(DB));await w.close();LASTMOD=(await h.getFile()).lastModified;if(force)toast('백업 저장: sauvegardes/'+name)}catch(e){}
}
async function useDir(h,mode){
 DIR=h;await idbSet('dir',h);DSTATE='ok';const fd=await readData();
 if(fd){const mig=MIGRATED;MIGRATED=false;if(DB&&mode!=='open'&&(DB.meta.rev||0)>(fd.meta.rev||0)){LASTMOD=0;await writeData()}else{DB=fd;DIRTY=false;saveLocal();if(mig){await saveSub('sauvegardes',`형식1_원본_${today()}.json`,await (await (await fh()).getFile()).text());await writeData()}}}
 else{if(!DB)DB=emptyDB();await writeData()}

}

let PHOTO={};
async function fileURL(dir,name){if(!name||!DIR||DSTATE!=='ok')return null;const k=dir+'/'+name;if(PHOTO[k])return PHOTO[k];try{const f=await (await (await DIR.getDirectoryHandle(dir)).getFileHandle(name)).getFile();return PHOTO[k]=URL.createObjectURL(f)}catch(e){return null}}

function resizeImg(file,max=1600){return new Promise((res,rej)=>{const img=new Image();img.onload=()=>{let w=img.naturalWidth,h=img.naturalHeight;const r=Math.min(1,max/Math.max(w,h));w=Math.round(w*r);h=Math.round(h*r);const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);c.toBlob(b=>b?res(b):rej(new Error('이미지 변환 실패')),'image/jpeg',.87)};img.onerror=()=>rej(new Error('사진 파일을 읽을 수 없습니다: '+file.name));img.src=URL.createObjectURL(file)})}
function needDir(){if(DIR&&DSTATE==='ok')return true;alert('사진과 자료를 저장하려면 먼저 OneDrive 폴더를 연결해 주세요.');return false}

async function uploadFiles(eid,files){
 if(!files||!files.length||!needDir())return;const e=elv(eid);let n=0;

   else{const ext=(file.name.split('.').pop()||'pdf').toLowerCase();const f=`${eid}_${t}.${ext}`;await saveSub('fiches',f,file);e.galerie.push({dir:'fiches',f,date:today(),label:file.name.replace(/\.[^.]+$/,'')})}
   n++}catch(x){alert(x.message)}}

  <div class="field"><label>누구에게</label><select onchange="UI.cd={don:this.value,ids:null};render()"><option value="">(이름 없이) ${a} 장학생 전체</option>${D.map(x=>`<option value="${x.id}" ${UI.cd.don===x.id?'selected':''}>${esc(x.nom)} — ${kidsOf(x.id,a).length}명${sentOf(x,a)?' ✓':''}</option>`).join('')}</select></div>
  ${UI.cd.ids?`<div><span class="tag vi">선택한 학생 ${L.length}명</span> <button class="small" onclick="UI.cd={don:'',ids:null};render()">해제</button></div>`:''}
  <div class="field" style="flex:1"><label>인사말</label><input value="${esc(DB.settings.cardTitle)}" onchange="DB.settings.cardTitle=this.value;save();render()"></div>
  <div class="field" style="flex:1"><label>아래 문구</label><input value="${esc(DB.settings.cardFooter)}" onchange="DB.settings.cardFooter=this.value;save();render()"></div></div>
  ${miss.length?`<div class="small" style="margin-top:8px;color:var(--warn)">⚠ 사진이나 ${a} 비전·기도제목이 없는 학생 ${miss.length}명: ${miss.map(e=>`<a href="#" onclick="go('eleve','${e.id}');return false">${esc(e.nom)}</a>`).join(', ')}</div>`:''}
  ${d?`<div style="margin-top:10px">${sentOf(d,a)?`<span class="tag ok">이 후원자에게 ${fmtD(sentOf(d,a))}에 보냄</span>`:`<button class="small" onclick="setSent('${d.id}','${a}',today())">✓ ${esc(d.nom)}에게 보냄 표시</button>`}</div>`:''}
 </div><div class="cards-pv" id="cpv"></div>`;
}
async function drawPreviews(){const box=$('#cpv');if(!box)return;const L=cardList();for(const e of L){if(!$('#cpv'))return;const c=await cardCanvas(e);const w=document.createElement('div');w.className='pv';w.appendChild(c);const r=document.createElement('div');r.className='ptop';r.style.margin='8px 2px 0';r.innerHTML=`<a href="#" class="small" onclick="go('eleve','${e.id}');return false"><b>${esc(e.nom)}</b></a><button class="small" onclick="cardPNG('${e.id}')">이미지 저장</button>`;w.appendChild(r);box.appendChild(w)}}
function wrap(ctx,text,maxW){const out=[];String(text||'').split('\n').forEach(par=>{let line='';for(const ch of [...par]){const t=line+ch;if(ctx.measureText(t).width>maxW&&line){const sp=line.lastIndexOf(' ');if(sp>line.length*0.55&&ch!==' '){out.push(line.slice(0,sp));line=line.slice(sp+1)+ch}else{out.push(line);line=ch.trimStart()}}else line=t}out.push(line)});return out}
function rrect(x,X,Y_,W,H,R){x.beginPath();x.moveTo(X+R,Y_);x.arcTo(X+W,Y_,X+W,Y_+H,R);x.arcTo(X+W,Y_+H,X,Y_+H,R);x.arcTo(X,Y_+H,X,Y_,R);x.arcTo(X,Y_,X+W,Y_,R);x.closePath()}
async function cardCanvas(e){
 const W=1500,H=1000,c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d');const a=A(),y=Y(e,a),d=UI.cd.don?don(UI.cd.don):null,s=DB.settings;
 const F='"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif',SC='"Snell Roundhand","Brush Script MT","Segoe Script",cursive',NAVY='#1f2a5a',ORG='#c0602b';
 x.fillStyle='#fdf8ef';x.fillRect(0,0,W,H);
 // 사진
 const px=70,py=70,pw=560,ph=700;const u=await photoURL(e);
 x.save();rrect(x,px,py,pw,ph,28);x.clip();
 if(u){const img=await new Promise(r=>{const i=new Image();i.onload=()=>r(i);i.onerror=()=>r(null);i.src=u});if(img){const sr=Math.max(pw/img.width,ph/img.height),sw=pw/sr,sh=ph/sr;x.drawImage(img,(img.width-sw)/2,Math.max(0,(img.height-sh)*0.3),sw,sh,px,py,pw,ph)}}
 else{x.fillStyle='#e8e4dc';x.fillRect(px,py,pw,ph);x.fillStyle='#a19a8e';x.font=`34px ${F}`;x.textAlign='center';x.fillText('사진',px+pw/2,py+ph/2)}
 x.restore();
 x.textAlign='center';x.fillStyle='#111';x.font=`bold 52px ${F}`;x.fillText(e.nom,px+pw/2,py+ph+78);
 x.font=`34px ${F}`;x.fillStyle='#444';const sub=[y.classe?(y.classe+(nivKo(y.classe)?` · ${nivKo(y.classe)}`:'')):'',e.naissance?`만 ${age(e.naissance)}세`:''].filter(Boolean).join('  ·  ');x.fillText(sub,px+pw/2,py+ph+130);
 // 오른쪽
 const tx=700,tw=W-tx-70,cx=tx+tw/2;
 x.fillStyle=NAVY;x.font=`104px ${SC}`;x.fillText('Merci Beaucoup',cx,190);
 x.font=`bold 40px ${F}`;x.fillStyle='#222';wrap(x,(d?d.nom+'님, ':'')+s.cardTitle,tw).forEach((l,i)=>x.fillText(l,cx,275+i*54));
 x.fillStyle='#d8cfbf';x.fillRect(tx+60,330,tw-120,2);
 let ty=400;x.textAlign='left';
 const lab=(t)=>{x.fillStyle=ORG;x.font=`bold 32px ${F}`;x.fillText(t,tx,ty);ty+=50};
 lab('비전');x.fillStyle='#222';x.font=`36px ${F}`;wrap(x,y.projet||'',tw).forEach(l=>{x.fillText(l,tx,ty);ty+=50});ty+=26;
 lab('기도제목');let fs=34,ll;do{x.font=`${fs}px ${F}`;ll=wrap(x,y.priere||'',tw);if(ty+ll.length*fs*1.5<=H-120)break;fs-=2}while(fs>22);
 x.fillStyle='#222';ll.forEach((l,i)=>x.fillText(l,tx,ty+i*fs*1.5));
 x.textAlign='right';x.font=`28px ${F}`;x.fillStyle='#6b6458';x.fillText(`${s.cardFooter} · ${a}`,W-70,H-60);
 return c;
}
async function cardPNG(id){const e=elv(id),c=await cardCanvas(e);c.toBlob(b=>download(`감사카드_${e.nom}_${A()}.png`,b),'image/png')}
async function allPNG(){const L=cardList(),a=A(),d=UI.cd.don?don(UI.cd.don):null;const toDir=DIR&&DSTATE==='ok';if(!confirm(`카드 이미지 ${L.length}장을 저장합니다.${toDir?'\n연결된 폴더의 cartes 폴더에 저장됩니다.':''}`))return;
 const sub=`${a}${d?'/'+d.nom.replace(/[\/\\:*?"<>|]/g,''):''}`;
 for(const e of L){const b=await new Promise(async r=>(await cardCanvas(e)).toBlob(r,'image/png'));const n=`감사카드_${e.nom}_${a}.png`;if(toDir){let dh=await DIR.getDirectoryHandle('cartes',{create:true});for(const p of sub.split('/'))dh=await dh.getDirectoryHandle(p,{create:true});const w=await (await dh.getFileHandle(n,{create:true})).createWritable();await w.write(b);await w.close()}else{download(n,b);await new Promise(r=>setTimeout(r,400))}}
 toast(toDir?`cartes/${sub} 폴더에 ${L.length}장 저장됨`:`${L.length}장 저장됨`);
 if(d&&!sentOf(d,a)&&confirm(`${d.nom}님께 보낸 것으로 표시할까요?`))setSent(d.id,a,today())}
async function printCards(){const L=cardList();let h='';for(let i=0;i<L.length;i+=2){h+='<div class="pgb">';for(const e of L.slice(i,i+2)){const c=await cardCanvas(e);h+=`<div class="prc"><img src="${c.toDataURL('image/jpeg',.9)}"></div>`}h+='</div>'}printHTML(h)}

async function printHTML(html){$('#print').innerHTML=html;await Promise.all([...$('#print').querySelectorAll('img')].map(i=>i.complete?0:new Promise(r=>{i.onload=i.onerror=r})));setTimeout(()=>window.print(),80)}
async function printEleve(id){const e=elv(id),a=CUR(),y=Y(e,a),u=await photoURL(e);
 const past=Object.keys(e.ans).filter(x=>x!==a&&(e.ans[x].projet||e.ans[x].priere)).sort().reverse();
 printHTML(`<div class="pg pgb"><div class="sheet-hd">${u?`<img class="pimg" src="${u}">`:'<div class="pimg">사진</div>'}<div style="flex:1"><div class="sheet-title">${esc(e.nom)}</div><div style="margin-bottom:2mm">장학생 자료 · ${a}</div>
 <table><tr><th>성별</th><td>${e.sexe==='F'?'여':e.sexe==='M'?'남':''}</td></tr><tr><th>생년월일</th><td>${fmtD(e.naissance)}${e.naissance?` (만 ${age(e.naissance)}세)`:''}</td></tr><tr><th>학교</th><td>${esc(y.ecole||curEcole(e))}</td></tr><tr><th>학년</th><td>${esc(y.classe||'')} ${nivKo(y.classe)?`(${nivKo(y.classe)})`:''}</td></tr></table></div></div>
 <table style="margin-bottom:5mm"><tr><th>아버지 / 보호자</th><td>${esc(e.pere)}</td></tr><tr><th>어머니 / 보호자</th><td>${esc(e.mere)}</td></tr><tr><th>연락처</th><td>${esc(e.tel)}</td></tr></table>
 <table style="margin-bottom:5mm"><tr><th>비전</th><td>${esc(y.projet)}</td></tr><tr><th>기도제목</th><td style="height:22mm">${esc(y.priere)}</td></tr></table>
 ${past.map(x=>`<table style="margin-bottom:3mm;font-size:11.5px"><tr><th colspan="2" style="width:auto">${x}${e.ans[x].classe?' · '+esc(e.ans[x].classe):''}</th></tr><tr><th>비전</th><td>${esc(e.ans[x].projet||'')}</td></tr><tr><th>기도제목</th><td>${esc(e.ans[x].priere||'')}</td></tr></table>`).join('')}
 <div style="font-size:10.5px;margin-top:6mm">출력일 ${fmtD(today())}</div></div>`)}
function ficheHTML(e,a){const an=a.replace(/-(\d\d)$/,(m,x)=>'-'+a.slice(0,2)+x),r=Y(e,a);return `<div class="fiche"><div class="ti">Fiche de l'élève boursier</div><div class="an">Année scolaire ${an}</div>
 <div class="l">Nom et prénoms : <b>${esc(e.nom)}</b></div><div class="l"><span style="flex:1">École : <b>${esc(r.ecole||curEcole(e))}</b></span><span style="width:45mm">Classe : <b>${esc(r.classe||'')}</b></span></div>
 <div class="l">Date de naissance : <b>${fmtFR(e.naissance)}</b> <span style="font-size:11px">Correction (si la date est fausse) :</span><span class="d"></span></div>
 <div class="l"><b>Nom du père ou du tuteur :</b><span class="d"></span></div><div class="l"><b>Nom de la mère ou de la tutrice :</b><span class="d"></span></div><div class="l"><b>Téléphone(s) :</b><span class="d"></span></div>
 <div class="l" style="margin-top:3mm"><b>Mon projet d'avenir (le métier que je veux faire) :</b></div><div class="dl"></div><div class="dl"></div>
 <div class="l" style="margin-top:3mm"><b>Mes sujets de prière :</b></div><div class="dl"></div><div class="dl"></div><div class="dl"></div></div>`}
function printFiches(ids){if(!ids.length){alert('학생이 없습니다');return}if(!confirm(`학생 카드 양식 ${ids.length}장을 출력합니다 (A4 한 장에 2명).\n이름·학교·학년·생년월일이 미리 채워집니다.`))return;const a=A(),L=ids.map(elv);let h='';for(let i=0;i<L.length;i+=2)h+=`<div class="pgb">${ficheHTML(L[i],a)}${L[i+1]?`<div class="cut">✂ découper ici</div>${ficheHTML(L[i+1],a)}`:''}</div>`;printHTML(h)}

/* ---------- 설정 ---------- */
function vReglages(){
 const a=DB.settings.annee,ys=annees(),n=+a.slice(0,4)+1,na=`${n}-${String(n+1).slice(2)}`;
 return hd('설정')+`<div class="card"><h2>새 학년도 시작</h2>
 ${ys.includes(na)?`<p class="muted">${na} 학년도가 이미 있습니다. 기본 학년도: <select onchange="DB.settings.annee=this.value;UI.annee=null;save();render()">${ys.map(y=>`<option ${y===a?'selected':''}>${y}</option>`).join('')}</select></p>`:
 `<p>${a} 장학생 ${roster(a).length}명을 ${na} 명단으로 옮깁니다. 학교는 그대로, 학년은 한 학년 올려서 넣습니다(CM2 → 6ème 등, 나중에 고칠 수 있음). 장래희망·기도제목·사진은 새로 받습니다.</p>
 <label style="display:block;margin-bottom:10px"><input type="checkbox" id="rk" checked> 후원자 연결도 그대로 이어가기</label><button class="primary" onclick="newYear('${na}')">${na} 학년도 시작</button>`}</div>
 <div class="card"><h2>저장 폴더</h2><p>${DSTATE==='ok'?`연결됨: <b>${esc(DIR.name)}</b> — 자료 파일, photos(사진), fiches(카드 원본), cartes(감사카드 이미지), sauvegardes(1주일마다 자동 백업, 30개 보관)`:'연결되지 않음'}</p>
 <div class="row"><button onclick="pickDir()">📁 폴더 다시 선택</button>${DSTATE==='ok'?'<button onclick="autoBackup(true)">지금 백업</button>':''}<button onclick="download('bourses_sauvegarde_'+today()+'.json',JSON.stringify(DB),'application/json')">백업 파일 내려받기</button><label class="btn">백업에서 복원<input type="file" accept=".json" hidden onchange="restoreBackup(this.files[0])"></label><button onclick="exportCSV()">${A()} 명단 내보내기 (엑셀)</button></div></div>
 <div class="card"><h2>최근 변경 기록</h2><div class="small" style="max-height:280px;overflow:auto">${[...DB.journal].reverse().slice(0,100).map(j=>`<div>${fmtD(j.at)} ${j.at.slice(11,16)} — ${esc(j.msg)}</div>`).join('')}</div></div>`;
}
function newYear(na){const a=DB.settings.annee,keep=$('#rk')?$('#rk').checked:true;if(!confirm(`${na} 학년도를 시작할까요?`))return;download(`bourses_sauvegarde_avant_${na}_${today()}.json`,JSON.stringify(DB),'application/json');
 roster(a).forEach(e=>{const p=e.ans[a];e.ans[na]={st:'장학생',ecole:p.ecole||'',classe:nextCls(p.classe)}});
 if(keep)DB.liens.filter(l=>l.annee===a).forEach(l=>DB.liens.push({annee:na,eleve:l.eleve,donateur:l.donateur}));
 DB.settings.annees=[...new Set([...DB.settings.annees,na])].sort();DB.settings.annee=na;UI.annee=null;save(`새 학년도 시작: ${na}`);UI.annee=na;go('statut');UI.annee=na;render();toast(na+' 학년도 시작')}
function exportCSV(){const a=A(),rows=[['이름','성별','생년월일','학교','학년','장래희망','기도제목','아버지/보호자','어머니/보호자','연락처','후원자']];roster(a).forEach(e=>{const y=Y(e,a);rows.push([e.nom,e.sexe,e.naissance,y.ecole||'',y.classe||'',y.projet||'',y.priere||'',e.pere,e.mere,e.tel,donsOf(e.id,a).map(d=>d.nom).join(', ')])});download(`장학생_${a}.csv`,'﻿'+rows.map(r=>r.map(c=>`"${String(c??'').replace(/"/g,'""')}"`).join(',')).join('\r\n'),'text/csv')}
function restoreBackup(file){if(!file)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(d.meta?.app!=='bourses')throw 0;if(DB&&!confirm(`이 백업(학생 ${d.eleves.length}명)으로 바꿀까요?`))return;const old=DB?.meta?.rev||0;DB=migrate(d);DB.meta.rev=Math.max(old,DB.meta.rev||0);save('백업에서 복원');render();toast('복원했습니다')}catch(e){alert('장학생 관리 백업 파일이 아닙니다.')}};r.readAsText(file)}

(async()=>{
 try{const t=localStorage.getItem(KEY);if(t)DB=migrate(JSON.parse(t))}catch(e){}
