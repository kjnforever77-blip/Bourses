<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>장학생 관리</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#3b3a6b">
<style>
:root{--ink:#1f2433;--muted:#5d6475;--line:#e1e3ea;--bg:#f5f6f9;--card:#fff;--accent:#4b4a8c;--accent-soft:#ecebf7;--side:#2f2e5a;--side-txt:#eceaf8;--side-muted:#b4b1d6;--side-line:#45437a;--danger:#b42318;--ok:#1a7f4b;--warn:#b54708}
*{box-sizing:border-box}
body{margin:0;font:14px/1.5 -apple-system,"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;color:var(--ink);background:var(--bg)}
.app{display:flex;min-height:100vh}
nav.side{width:210px;background:var(--side);color:var(--side-txt);flex-shrink:0;padding:10px 0;position:sticky;top:0;height:100vh;overflow:auto}
.brand{padding:10px 18px 14px;font-weight:700;font-size:16px;border-bottom:1px solid var(--side-line);margin-bottom:8px}
nav.side a{display:flex;align-items:center;gap:10px;margin:2px 10px;padding:0 12px;min-height:42px;border-radius:8px;color:var(--side-txt);text-decoration:none;cursor:pointer;font-size:15px}
nav.side a:hover{background:rgba(255,255,255,.08)}nav.side a.active{background:var(--accent);color:#fff;font-weight:600}
nav.side .foot{padding:12px 18px;border-top:1px solid var(--side-line);margin-top:12px;font-size:12px;color:var(--side-muted)}
nav.side .foot button{width:100%;margin-top:6px;background:rgba(255,255,255,.1);color:#fff;border-color:rgba(255,255,255,.22)}
main{flex:1;padding:22px 28px;min-width:0;max-width:1120px}
h1{font-size:21px;margin:0}h2{font-size:16px;margin:0}h3{font-size:15px;margin:0 0 4px}
.hd{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin:0 0 16px}.hp{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:16px}
.ch{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.field{display:flex;flex-direction:column;gap:3px;min-width:150px}.field label{font-size:12px;color:var(--muted)}
input,select,textarea{font:inherit;padding:7px 9px;border:1px solid #c7cbd6;border-radius:7px;background:#fff;color:inherit}
textarea{min-height:80px;width:100%;resize:vertical}
button,.btn{font:inherit;padding:7px 13px;border-radius:7px;border:1px solid #c7cbd6;background:#fff;cursor:pointer;color:inherit;display:inline-flex;align-items:center;gap:5px;text-decoration:none;white-space:nowrap}
button:hover,.btn:hover{border-color:#98a0b3}button.primary,.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
button.danger{color:var(--danger);border-color:#f0b4ae}button.small,.btn.small{padding:3px 10px;font-size:12.5px}
button:disabled{opacity:.5;cursor:default}
a.lk{color:var(--accent);cursor:pointer;text-decoration:none}a.lk:hover{text-decoration:underline}
table.data{width:100%;border-collapse:collapse;background:#fff}
table.data th,table.data td{border-bottom:1px solid var(--line);padding:9px 10px;text-align:left;vertical-align:middle}
table.data th{font-size:12px;color:var(--muted);font-weight:600;background:#fafbfc;white-space:nowrap}
table.data tr.click{cursor:pointer}table.data tr.click:hover td{background:#f7f7fc}
.tag{display:inline-block;padding:1px 9px;border-radius:10px;font-size:12px;background:#eef0f4;margin:1px 3px 1px 0;white-space:nowrap}
.tag.ok{background:#e3f4ea;color:var(--ok)}.tag.warn{background:#fdf0e1;color:var(--warn)}.tag.bad{background:#fde8e6;color:var(--danger)}.tag.vi{background:var(--accent-soft);color:var(--accent)}
.muted{color:var(--muted)}.small{font-size:12.5px}
.k{font-size:12px;color:var(--muted);margin-bottom:1px}
.banner{padding:10px 14px;border-radius:9px;margin-bottom:14px;background:#fff7e6;border:1px solid #f5d9a8}.banner.info{background:#eef2ff;border-color:#c7d0f5}
.ph{background:#e9ebf1;display:flex;align-items:center;justify-content:center;color:#9aa1b2;font-size:11px;text-align:center}
.empty{padding:28px;text-align:center;color:var(--muted)}
/* 아이 페이지 */
.prof{display:flex;gap:24px;align-items:flex-start}
.pphoto{width:170px;height:215px;object-fit:cover;border-radius:12px;display:flex;flex:none}
.pinfo{flex:1;min-width:0}
.pgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px 18px;margin-top:14px}.pgrid .w3{grid-column:1/-1}
.vp{display:grid;grid-template-columns:1fr 2fr;gap:18px;margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
.dream{font-size:16px;font-weight:600}.pray{font-size:15px;line-height:1.6;border-left:3px solid var(--accent);padding:0 0 0 12px}
.dons{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px;align-items:center}
.dchip{border:1px solid var(--line);border-radius:18px;padding:3px 12px;cursor:pointer;font-size:13px;background:#fafaff}.dchip:hover{border-color:#a9a6d6}
/* 이야기 기록 */
.tl{position:relative;margin-left:8px;padding-left:22px;border-left:2px solid #e3e3f0}
.ev{position:relative;margin-bottom:16px}.ev:before{content:"";position:absolute;left:-29px;top:6px;width:12px;height:12px;border-radius:50%;background:#fff;border:3px solid var(--accent)}
.ev .eh{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.ev .dt{font-weight:600}.ev .tx{margin-top:4px;white-space:pre-wrap}
.ev .acts{margin-left:auto;display:flex;gap:4px;opacity:.55}.ev:hover .acts{opacity:1}
.files{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.fi{width:96px;height:120px;border-radius:8px;object-fit:cover;cursor:pointer;border:1px solid var(--line);display:flex;background:#f1f2f6}
.fdoc{width:96px;height:120px;border-radius:8px;border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;background:#f7f7fa;font-size:30px}.fdoc span{font-size:10.5px;padding:2px 4px;text-align:center;word-break:break-all;line-height:1.2}
.ty{font-size:11.5px;padding:1px 8px;border-radius:9px;background:#eef0f4}
.ty.카드{background:#ecebf7;color:#4b4a8c}.ty.사진{background:#e6f3fb;color:#1f6c99}.ty.성적{background:#fdf0e1;color:#9a5b12}.ty.진급{background:#e3f4ea;color:#1a7f4b}.ty.소식{background:#fbe9f1;color:#a2325f}.ty.메모{background:#eef0f4;color:#555}
/* 후원자 */
.kids{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px}
.kid{display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:8px;background:#fff}
.kid .kim{width:52px;height:64px;border-radius:7px;object-fit:cover;flex:none;display:flex;cursor:pointer}
/* 모달 */
.modal-bg{position:fixed;inset:0;background:rgba(15,23,42,.45);display:flex;align-items:flex-start;justify-content:center;padding:30px 10px;overflow:auto;z-index:50}
.modal{background:#fff;border-radius:12px;padding:20px 22px;width:min(700px,100%);box-shadow:0 10px 40px rgba(0,0,0,.25)}.modal h3{font-size:17px;margin:0 0 14px}
.form-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px 14px}.form-grid .full{grid-column:1/-1}
.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap}
.chk{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:3px 12px;max-height:50vh;overflow:auto;border:1px solid var(--line);border-radius:8px;padding:8px}
.chk label{display:flex;gap:7px;align-items:center;padding:4px;border-radius:5px;cursor:pointer}.chk label:hover{background:#f4f4fa}
.toast{position:fixed;bottom:18px;right:18px;background:#1f2433;color:#fff;padding:10px 14px;border-radius:8px;z-index:60}
.cards-pv{display:grid;grid-template-columns:repeat(auto-fill,minmax(400px,1fr));gap:14px}
.pv{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px}.pv canvas{width:100%;height:auto;border-radius:6px;display:block}
#print{display:none}
/* 출력물: 흑백 */
.pg{color:#000;background:#fff;font-size:12.5px;line-height:1.45}
.pg table{border-collapse:collapse;width:100%}.pg th,.pg td{border:1px solid #000;padding:5px 7px;text-align:left;vertical-align:top}.pg th{width:32mm}
.sheet-hd{display:flex;gap:7mm;align-items:flex-start;margin-bottom:6mm}.sheet-hd .pimg{width:35mm;height:45mm;object-fit:cover;border:1px solid #000;flex:none;display:flex;align-items:center;justify-content:center;font-size:10px}
.sheet-title{font-size:18px;font-weight:bold;margin:0 0 2mm}
.prc{width:180mm;height:122mm;border:1px solid #000;margin:0 auto 6mm;display:flex;align-items:center;justify-content:center}.prc img{max-width:100%;max-height:100%}
.fiche{height:127mm;padding:4mm 6mm;font-family:Arial,Helvetica,sans-serif;font-size:13px;color:#000;display:flex;flex-direction:column}
.fiche .ti{text-align:center;font-weight:bold;font-size:17px}.fiche .an{text-align:center;font-size:12px;margin-bottom:3mm;border-bottom:1.5px solid #000;padding-bottom:3mm}
.fiche .l{margin:2.2mm 0;display:flex;gap:2mm;align-items:baseline}.fiche .l .d{flex:1;border-bottom:1px dotted #000;min-height:5mm}.fiche .dl{border-bottom:1px dotted #000;height:7mm}
.cut{font-size:10px;border-top:1px dashed #000;margin:2mm 0;padding-top:1mm}
@media (max-width:860px){.app{flex-direction:column}nav.side{width:auto;height:auto;position:static;display:flex;flex-wrap:wrap;padding:6px}.brand{width:100%;border:0;margin:0;padding:6px 10px}nav.side a{min-height:34px}nav.side .foot{display:none}main{padding:12px}.prof{flex-direction:column;align-items:center}.pgrid{grid-template-columns:1fr 1fr}.vp{grid-template-columns:1fr}.cards-pv{grid-template-columns:1fr}.hide-m{display:none}}
@media print{body{background:#fff}.app,.modal-bg,.toast{display:none!important}#print{display:block}@page{size:A4;margin:12mm}#print .pgb{page-break-after:always;break-after:page}#print .pgb:last-child{page-break-after:auto;break-after:auto}}
</style>
</head>
<body>
<div class="app"><nav class="side" id="nav"></nav><main id="main"></main></div>
<div id="print"></div>
<script>
'use strict';
/* =====================================================================
   장학생 관리
   중심: 아이의 이야기(기록) + 후원자와의 연결(시작일~끝난 날) + 보낸 소식
   자료: 자료 폴더의 jangak_donnees.json, photos/(사진), fiches/(문서), cartes/(감사카드), sauvegardes/(백업)
   ===================================================================== */
const APP_VERSION='15 (2026-11-21)';
const DATAFILE='jangak_donnees.json',KEY='jangak_db_v1',OLDFILE='bourses_donnees.json';
const TYPES=['카드','사진','진급','성적','소식','메모'];
const TYPE_HELP={카드:'장학생이 쓴 비전·기도제목 카드',사진:'사진 모음',진급:'학교·학년이 바뀜',성적:'성적표·통지표',소식:'장학생·가정 소식',메모:'기타 메모'};
const CLS=['PS','MS','GS','CP1','CP2','CE1','CE2','CM1','CM2','6ème','5ème','4ème','3ème','2nde','1ère','Tle'];
const NIV={PS:'유치원(소)',MS:'유치원(중)',GS:'유치원(대)',CP1:'초등 1학년',CP2:'초등 2학년',CE1:'초등 3학년',CE2:'초등 4학년',CM1:'초등 5학년',CM2:'초등 6학년','6ème':'중학교 1학년','5ème':'중학교 2학년','4ème':'중학교 3학년','3ème':'중학교 4학년','2nde':'고등학교 1학년','1ère':'고등학교 2학년','Tle':'고등학교 3학년'};
const SINCE_WARN=180;
let DB=null,DIR=null,DSTATE='none',DERR='',LASTMOD=0,DIRTY=false,OLD_HAS=false;
const UI={view:'enfants',id:null,f:{s:'on',q:''},df:'on',cd:{don:'',ids:null}};

/* ---------- 도구 ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today=()=>new Date().toISOString().slice(0,10);
const fmtD=d=>d?d.slice(0,10).replace(/-/g,'.'):'';
const fmtFR=d=>{if(!d)return '';const [y,m,j]=d.split('-');return `${j}/${m}/${y}`};
function age(d){if(!d)return '';const b=new Date(d),n=new Date();let a=n.getFullYear()-b.getFullYear();if(n.getMonth()<b.getMonth()||(n.getMonth()===b.getMonth()&&n.getDate()<b.getDate()))a--;return a}
const daysSince=d=>d?Math.floor((Date.now()-new Date(d).getTime())/864e5):Infinity;
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2600)}
function download(name,data,type){const b=data instanceof Blob?data:new Blob([data],{type});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500)}
const cmpNom=(a,b)=>a.nom.localeCompare(b.nom,'fr'),cmpKo=(a,b)=>a.nom.localeCompare(b.nom,'ko');
function nivKo(c){if(!c)return '';const k=Object.keys(NIV).find(k=>k.toLowerCase()===String(c).trim().toLowerCase());return k?NIV[k]:''}
const isImg=f=>/\.(jpe?g|png|gif|webp)$/i.test(f);
function nid(arr,p){let n=0;arr.forEach(x=>{const k=parseInt(String(x.id).slice(p.length),10);if(k>n)n=k});return p+String(n+1).padStart(3,'0')}
function syOf(d){if(!d)return '';const y=+d.slice(0,4),m=+d.slice(5,7);return m>=8?y:y-1}
const syLabel=d=>{const y=syOf(d);return y?`${y}-${y+1}학년도`:''};
function sySelect(id,val){const cur=syOf(today()),v=syOf(val);let o='';for(let y=cur+1;y>=cur-12;y--)o+=`<option value="${y}-09-01" ${y===v?'selected':''}>${y}-${y+1}학년도</option>`;return `<select id="${id}"><option value="">—</option>${o}</select>`}
function sySelectEnd(id,val){const cur=syOf(today()),v=val?syOf(val):null;let o='';for(let y=cur;y>=cur-12;y--)o+=`<option value="${y+1}-07-31" ${y===v?'selected':''}>${y}-${y+1}학년도까지</option>`;return `<select id="${id}"><option value="">계속 장학 중</option>${o}</select>`}
function schoolYear(d=new Date()){const y=d.getMonth()>=7?d.getFullYear():d.getFullYear()-1;return `${y}-${y+1}`}

/* ---------- 자료 ---------- */
const isOn=e=>!e.fin||e.fin>=today();
const kid=id=>DB.enfants.find(e=>e.id===id),don=id=>DB.donateurs.find(d=>d.id===id);
const liensOn=()=>DB.liens.filter(l=>!l.fin||l.fin>=today());
const donsOf=eid=>liensOn().filter(l=>l.enfant===eid).map(l=>({...don(l.donateur),lien:l})).filter(x=>x.id).sort(cmpKo);
const kidsOf=did=>liensOn().filter(l=>l.donateur===did).map(l=>({...kid(l.enfant),lien:l})).filter(x=>x.id).sort(cmpNom);
const recs=eid=>DB.histoires.filter(h=>h.enfant===eid).sort((a,b)=>b.date.localeCompare(a.date)||b.id.localeCompare(a.id));
const lastCard=eid=>recs(eid).find(h=>h.type==='카드'&&(h.projet||h.priere))||{};
const lastSent=did=>DB.envois.filter(x=>x.donateur===did).map(x=>x.date).sort().pop()||'';
function logJ(m){DB.journal.push({at:new Date().toISOString(),msg:m});if(DB.journal.length>800)DB.journal=DB.journal.slice(-800)}
function emptyDB(){return {meta:{app:'jangak',v:1,rev:0,at:new Date().toISOString()},settings:{cardTitle:'후원해 주셔서 감사합니다',cardFooter:'부르키나파소 보보디울라소에서',lastBackup:null},enfants:[],histoires:[],donateurs:[],liens:[],envois:[],journal:[]}}
function norm(d){const e=emptyDB();for(const k of Object.keys(e))d[k]=d[k]??e[k];d.settings=Object.assign(e.settings,d.settings);return d}

/* ---------- 저장 (브라우저 + 자료 폴더) ---------- */
function idb(){return new Promise((res,rej)=>{const r=indexedDB.open('jangak_fichier',1);r.onupgradeneeded=()=>r.result.createObjectStore('h');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
async function idbGet(k){const d=await idb();return new Promise(r=>{const q=d.transaction('h').objectStore('h').get(k);q.onsuccess=()=>r(q.result);q.onerror=()=>r(null)})}
async function idbSet(k,v){const d=await idb();return new Promise(r=>{const t=d.transaction('h','readwrite');t.objectStore('h').put(v,k);t.oncomplete=()=>r()})}
const DIR_OK=typeof window.showDirectoryPicker==='function';
const saveLocal=()=>{try{localStorage.setItem(KEY,JSON.stringify(DB))}catch(e){}};
const fh=()=>DIR.getFileHandle(DATAFILE,{create:true});
async function readData(){const f=await (await fh()).getFile();LASTMOD=f.lastModified;const t=await f.text();return t.trim()?norm(JSON.parse(t)):null}
let saveT=null;
function save(msg){if(msg)logJ(msg);DB.meta.rev=(DB.meta.rev||0)+1;DB.meta.at=new Date().toISOString();DIRTY=true;saveLocal();clearTimeout(saveT);saveT=setTimeout(writeData,250);renderFoot()}
async function writeData(){
 if(!DIR||DSTATE!=='ok')return;
 try{const h=await fh(),f=await h.getFile();
  if(LASTMOD&&f.lastModified!==LASTMOD){let o=null;try{o=JSON.parse(await f.text())}catch(e){}
   if(o&&(o.meta?.rev||0)>=(DB.meta.rev||0)){await saveSub('sauvegardes',`충돌_${today()}_${Date.now()}.json`,JSON.stringify(DB));DB=norm(o);LASTMOD=f.lastModified;DIRTY=false;saveLocal();render();alert('다른 곳에서 자료 파일이 먼저 바뀌어 그 내용을 불러왔습니다. 방금 고친 내용은 sauvegardes 폴더에 "충돌_…" 파일로 보관했습니다.');return}}
  const w=await h.createWritable();await w.write(JSON.stringify(DB));await w.close();LASTMOD=(await h.getFile()).lastModified;DIRTY=false;renderFoot();autoBackup();
 }catch(e){DSTATE='error';DERR=e.message;renderFoot()}
}
async function subDir(path){let d=DIR;for(const p of path.split('/'))d=await d.getDirectoryHandle(p,{create:true});return d}
async function saveSub(dir,name,data){const w=await (await (await subDir(dir)).getFileHandle(name,{create:true})).createWritable();await w.write(data);await w.close()}
async function autoBackup(force){
 if(!DIR||DSTATE!=='ok')return;const lb=DB.settings.lastBackup;if(!force&&lb&&daysSince(lb)<7)return;
 try{const name=`jangak_sauvegarde_${today()}.json`;DB.settings.lastBackup=new Date().toISOString();await saveSub('sauvegardes',name,JSON.stringify(DB));
  const d=await subDir('sauvegardes');const ns=[];for await(const [n] of d.entries())if(/^jangak_sauvegarde_\d{4}-\d{2}-\d{2}\.json$/.test(n))ns.push(n);ns.sort();while(ns.length>30){try{await d.removeEntry(ns.shift())}catch(e){}}
  saveLocal();const h=await fh();const w=await h.createWritable();await w.write(JSON.stringify(DB));await w.close();LASTMOD=(await h.getFile()).lastModified;if(force)toast('백업 저장: sauvegardes/'+name)}catch(e){}
}
async function useDir(h,mode){
 DIR=h;await idbSet('dir',h);DSTATE='ok';const fd=await readData();
 try{await h.getFileHandle(OLDFILE);OLD_HAS=true}catch(e){OLD_HAS=false}
 if(fd){if(DB&&mode!=='open'&&(DB.meta.rev||0)>(fd.meta.rev||0)){LASTMOD=0;await writeData()}else{DB=fd;DIRTY=false;saveLocal()}}
 else{DB=emptyDB();LASTMOD=0;await writeData()}
 FURL={};render();
}
async function pickDir(){
 if(!DIR_OK){alert('이 브라우저에서는 폴더 연결이 안 됩니다. 맥북의 크롬에서 열어 주세요.');return}
 try{const h=await window.showDirectoryPicker({id:'jangak-dir',mode:'readwrite'});let has=false;try{await h.getFileHandle(DATAFILE);has=true}catch(e){}

function resizeImg(file,max=1600){return new Promise((res,rej)=>{const img=new Image();img.onload=()=>{let w=img.naturalWidth,h=img.naturalHeight;const r=Math.min(1,max/Math.max(w,h));w=Math.round(w*r);h=Math.round(h*r);const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);c.toBlob(b=>b?res(b):rej(new Error('이미지 변환 실패')),'image/jpeg',.87)};img.onerror=()=>rej(new Error('사진 파일을 읽을 수 없습니다: '+file.name));img.src=URL.createObjectURL(file)})}

async function storeFiles(eid,files){const out=[];let n=0;for(const file of files){const t=`${eid}_${Date.now()}_${n++}`;

 modal(`<h3>${esc(e.nom)} — ${hid?'기록 수정':'기록 추가'}</h3><div class="form-grid">
 <div class="field"><label>날짜</label><input id="r_dt" type="date" value="${esc(h.date)}"></div>
 <div class="field"><label>종류</label><select id="r_ty" onchange="recFields()">${TYPES.map(t=>`<option value="${t}" ${h.type===t?'selected':''}>${t} — ${TYPE_HELP[t]}</option>`).join('')}</select></div>
 <div class="field full rf-card"><label>비전 (장래희망)</label><input id="r_pj" value="${esc(h.projet)}"></div>
 <div class="field full rf-card"><label>기도제목</label><textarea id="r_pr">${esc(h.priere)}</textarea></div>
 <div class="field rf-prom"><label>학교</label><input id="r_ec" list="ecs" value="${esc(h.ecole||e.ecole)}">${ecoleList()}</div>
 <div class="field rf-prom"><label>학년</label><input id="r_cl" list="cls" value="${esc(h.classe||'')}">${clsList()}</div>
 <div class="field full"><label>내용</label><textarea id="r_tx" style="min-height:60px">${esc(h.texte)}</textarea></div>
 <div class="field full"><label>사진·파일 ${h.fichiers?.length?`(지금 ${h.fichiers.length}개 — 더 올리면 추가됨)`:''}</label><input id="r_fi" type="file" multiple accept="image/*,.pdf"></div>
 ${h.fichiers?.length?`<div class="full files">${h.fichiers.map((x,i)=>`<label style="display:flex;flex-direction:column;align-items:center;gap:3px">${isImg(x.f)?`<img class="fi" data-f="${x.dir}|${esc(x.f)}" style="visibility:hidden">`:`<div class="fdoc">📄<span>${esc(x.nom||x.f)}</span></div>`}<span class="small"><input type="checkbox" class="r_del" value="${i}"> 빼기</span></label>`).join('')}</div>`:''}
 </div>
 <div class="actions">${hid?`<button class="danger" style="margin-right:auto" onclick="delRec('${hid}')">기록 삭제</button>`:''}<button onclick="closeM()">취소</button><button class="primary" onclick="saveRec('${eid}','${hid||''}')">저장</button></div>`);
 recFields();fillImgs(document.querySelector('.modal'));
}
function recFields(){const t=fv('r_ty');document.querySelectorAll('.rf-card').forEach(x=>x.style.display=t==='카드'?'':'none');document.querySelectorAll('.rf-prom').forEach(x=>x.style.display=t==='진급'?'':'none')}
async function saveRec(eid,hid){
 const e=kid(eid),files=$('#r_fi').files,t=fv('r_ty');if(files.length&&!needDir())return;
 let h=hid?DB.histoires.find(x=>x.id===hid):null;if(!h){h={id:nid(DB.histoires,'H'),enfant:eid,fichiers:[]};DB.histoires.push(h)}
 const del=new Set([...document.querySelectorAll('.r_del:checked')].map(x=>+x.value));h.fichiers=(h.fichiers||[]).filter((x,i)=>!del.has(i));
 Object.assign(h,{date:fv('r_dt')||today(),type:t,texte:fv('r_tx'),projet:t==='카드'?fv('r_pj'):'',priere:t==='카드'?fv('r_pr'):'',ecole:t==='진급'?fv('r_ec'):'',classe:t==='진급'?fv('r_cl'):''});
 if(files.length){try{h.fichiers.push(...await storeFiles(eid,files))}catch(x){alert(x.message)}}
 if(t==='진급'){const lastP=DB.histoires.filter(x=>x.enfant===eid&&x.type==='진급').sort((a,b)=>b.date.localeCompare(a.date))[0];if(lastP===h){if(h.ecole)e.ecole=h.ecole;if(h.classe)e.classe=h.classe}}
 if(!e.photo){const p=h.fichiers.find(x=>x.dir==='photos');if(p)e.photo=p.f}
 save(`기록 ${hid?'수정':'추가'}: ${e.nom} (${t})`);closeM();render()}
function delRec(hid){if(!confirm('이 기록을 지울까요? (올린 파일은 폴더에 남습니다)'))return;DB.histoires=DB.histoires.filter(h=>h.id!==hid);save('기록 삭제');closeM();render()}
function linkFromKid(eid){const e=kid(eid),cur=new Set(donsOf(eid).map(d=>d.id));const L=DB.donateurs.filter(d=>isOn(d)||cur.has(d.id)).sort((a,b)=>cur.has(b.id)-cur.has(a.id)||cmpKo(a,b));
 modal(`<h3>${esc(e.nom)} — 후원자</h3><p class="small muted" style="margin:-6px 0 10px">체크하면 연결되고, 체크를 풀면 빠집니다. 지금 연결된 후원자가 맨 위에 있습니다.</p>
 <div class="field" style="margin-bottom:10px;max-width:240px"><label>새로 연결할 때 시작 학년도</label>${sySelect('l_db',today())}</div>
 <div class="chk">${L.map(d=>`<label><input type="checkbox" value="${d.id}" ${cur.has(d.id)?'checked':''}> ${cur.has(d.id)?'<b>':''}${esc(d.nom)}${cur.has(d.id)?'</b>':''} <span class="muted small">${kidsOf(d.id).length}명</span></label>`).join('')||'<span class="muted">후원자가 없습니다</span>'}</div>
 <div class="actions"><button style="margin-right:auto" onclick="closeM();editDon()">＋ 새 후원자</button><button onclick="closeM()">취소</button><button class="primary" onclick="saveLinkKid('${eid}')">저장</button></div>`)}
function saveLinkKid(eid){const db=fv('l_db')||(syOf(today())+'-09-01'),sy=syOf(today());const sel=new Set([...document.querySelectorAll('.chk input:checked')].map(x=>x.value));const cur=donsOf(eid);const add=[],rm=[];
 cur.forEach(d=>{if(sel.has(d.id))return;const l=DB.liens.find(x=>x.id===d.lien.id);if(syOf(l.debut)>=sy)DB.liens=DB.liens.filter(x=>x!==l);else l.fin=`${sy}-08-31`;rm.push(d.nom)});
 sel.forEach(id=>{if(cur.some(d=>d.id===id))return;DB.liens.push({id:nid(DB.liens,'L'),enfant:eid,donateur:id,debut:db,fin:''});add.push(don(id).nom)});
 if(add.length||rm.length)save(`후원자 변경: ${kid(eid).nom}${add.length?' ＋'+add.join(', '):''}${rm.length?' －'+rm.join(', '):''}`);closeM();render();if(rm.length)toast(`뺐습니다: ${rm.join(', ')}`)}
/* ---------- 후원자 ---------- */
function vDonateurs(){
 let L=[...DB.donateurs].sort(cmpKo);if(UI.df==='on')L=L.filter(d=>!d.fin);else if(UI.df==='off')L=L.filter(d=>d.fin);
 return hd('후원자',`<button class="primary" onclick="editDon()">＋ 새 후원자</button>`)+
 `<div class="card"><div class="row"><div class="field"><label>보기</label><select onchange="UI.df=this.value;render()">${[['on','후원 중'],['off','후원 끝남'],['all','전체']].map(([v,l])=>`<option value="${v}" ${UI.df===v?'selected':''}>${l}</option>`).join('')}</select></div></div></div>
 <div class="card" style="padding:0;overflow:auto"><table class="data"><thead><tr><th>이름</th><th class="hide-m">구분</th><th>후원 장학생</th><th>마지막 소식</th></tr></thead><tbody>
 ${L.map(d=>{const k=kidsOf(d.id),s=lastSent(d.id),ds=daysSince(s);return `<tr class="click" onclick="go('donateur','${d.id}')"><td><b>${esc(d.nom)}</b>${d.fin?' <span class="tag">끝남</span>':''}</td><td class="hide-m">${esc(d.type)}</td><td>${k.length?`<b>${k.length}명</b> <span class="muted small">${esc(k.map(x=>x.nom).join(', '))}</span>`:'<span class="muted">—</span>'}</td><td>${s?`<span class="tag ${ds>SINCE_WARN?'warn':'ok'}">${fmtD(s)}</span>`:k.length?'<span class="tag warn">보낸 적 없음</span>':''}</td></tr>`}).join('')||'<tr><td colspan="4" class="empty">후원자가 없습니다</td></tr>'}
 </tbody></table></div>`}
function vDonateur(){
 const d=don(UI.id);if(!d)return '<p>찾을 수 없습니다.</p>';const k=kidsOf(d.id);
 const past=DB.liens.filter(l=>l.donateur===d.id&&l.fin&&l.fin<today()).sort((a,b)=>b.fin.localeCompare(a.fin));const E=DB.envois.filter(x=>x.donateur===d.id).sort((a,b)=>b.date.localeCompare(a.date));
 const kv=(a,b,c='')=>`<div class="${c}"><div class="k">${a}</div><div>${b||'<span class="muted">—</span>'}</div></div>`;
 return `<div class="hd"><div class="hp"><button onclick="go('donateurs')">← 후원자</button></div><div class="hp">${k.length?`<button class="primary" onclick="UI.cd={don:'${d.id}',ids:null};go('envoi')">💌 감사카드 만들기</button>`:''}<button onclick="editDon('${d.id}')">✏️ 정보 수정</button></div></div>
 <div class="card"><div class="ch" style="margin:0"><h1 style="font-size:24px">${esc(d.nom)}</h1>${d.fin?`<span class="tag">후원 끝남 ${fmtD(d.fin)}</span>`:'<span class="tag ok">후원 중</span>'}</div>
  <div class="pgrid">${kv('구분',esc(d.type))}${kv('후원 방식',[esc(d.cycle),d.montant?d.montant.toLocaleString('ko-KR')+' '+esc(d.devise):''].filter(Boolean).join(' · '))}${kv('연락처',esc(d.contact))}${d.memo?kv('메모',esc(d.memo),'w3'):''}</div></div>
 <div class="card"><div class="ch"><h2>후원 장학생 <span class="muted small" style="font-weight:400">${k.length}명</span></h2><button class="small primary" onclick="linkFromDon('${d.id}')">＋ 장학생 연결</button></div>
  <div class="kids">${k.map(e=>`<div class="kid">${imgTag(e,'kim')}<div style="min-width:0;flex:1"><a class="lk" onclick="go('enfant','${e.id}')"><b>${esc(e.nom)}</b></a><div class="small muted">${esc(e.ecole)} ${esc(e.classe)}</div><div class="small muted">${e.lien.debut?syLabel(e.lien.debut)+'부터':''}</div></div><button class="small" title="후원 끝내기" onclick="endLink('${e.lien.id}')">끝내기</button></div>`).join('')||'<div class="muted">지금 후원하는 장학생이 없습니다</div>'}</div>
  ${past.length?`<details style="margin-top:12px"><summary class="small" style="cursor:pointer;color:var(--accent)">지난 후원 (${past.length})</summary><div class="small" style="margin-top:6px">${past.map(l=>`<div>${esc(kid(l.enfant)?.nom||'')} · ${fmtD(l.debut)} ~ ${fmtD(l.fin)}</div>`).join('')}</div></details>`:''}
 </div>
 <div class="card"><div class="ch"><h2>보낸 소식 <span class="muted small" style="font-weight:400">${E.length}</span></h2><button class="small" onclick="addEnvoi('${d.id}')">＋ 보낸 기록 추가</button></div>
  ${E.map(x=>`<div style="padding:6px 0;border-bottom:1px solid var(--line)"><b>${fmtD(x.date)}</b> <span class="small">${esc(x.note||'감사카드')}</span> <span class="muted small">${esc((x.enfants||[]).map(i=>kid(i)?.nom).filter(Boolean).join(', '))}</span> <button class="small" style="float:right" onclick="delEnvoi('${x.id}')">×</button></div>`).join('')||'<div class="muted small">아직 보낸 기록이 없습니다</div>'}
 </div>`}
function linkFromDon(did){const d=don(did),cur=new Set(kidsOf(did).map(e=>e.id));const L=DB.enfants.filter(e=>isOn(e)&&!cur.has(e.id)).sort((a,b)=>donsOf(a.id).length-donsOf(b.id).length||cmpNom(a,b));
 modal(`<h3>${esc(d.nom)} — 장학생 연결</h3><div class="field" style="margin-bottom:10px;max-width:240px"><label>후원 시작 학년도</label>${sySelect('l_db',today())}</div><p class="small muted" style="margin:0 0 6px">괄호는 이미 연결된 후원자 수 (적은 순)</p>
 <div class="chk">${L.map(e=>`<label><input type="checkbox" value="${e.id}"> ${esc(e.nom)} <span class="muted small">(${donsOf(e.id).length})</span></label>`).join('')||'<span class="muted">연결할 장학생이 없습니다</span>'}</div>
 <div class="actions"><button onclick="closeM()">취소</button><button class="primary" onclick="saveLinkDon('${did}')">연결</button></div>`)}
function saveLinkDon(did){const db=fv('l_db')||(syOf(today())+'-09-01');const ids=[...document.querySelectorAll('.chk input:checked')].map(x=>x.value);ids.forEach(e=>DB.liens.push({id:nid(DB.liens,'L'),enfant:e,donateur:did,debut:db,fin:''}));if(ids.length)save(`후원 연결: ${don(did).nom} → ${ids.map(i=>kid(i).nom).join(', ')}`);closeM();render()}
function endLink(lid){const l=DB.liens.find(x=>x.id===lid);modal(`<h3>후원 끝내기</h3><p>${esc(don(l.donateur).nom)} → ${esc(kid(l.enfant).nom)}</p><div class="field"><label>끝난 날</label><input id="l_fn" type="date" value="${today()}" style="width:180px"></div><p class="small muted">기록은 "지난 후원"에 남습니다.</p><div class="actions"><button class="danger" style="margin-right:auto" onclick="if(confirm('연결 기록 자체를 지울까요? (잘못 연결한 경우)')){DB.liens=DB.liens.filter(x=>x.id!=='${lid}');save('연결 삭제');closeM();render()}">잘못 연결함 (지우기)</button><button onclick="closeM()">취소</button><button class="primary" onclick="DB.liens.find(x=>x.id==='${lid}').fin=fv('l_fn')||today();save('후원 끝남');closeM();render()">끝내기</button></div>`)}
function addEnvoi(did){modal(`<h3>보낸 기록 추가</h3><div class="form-grid"><div class="field"><label>날짜</label><input id="v_dt" type="date" value="${today()}"></div><div class="field full"><label>무엇을 보냈나요</label><input id="v_nt" value="감사카드"></div></div><div class="actions"><button onclick="closeM()">취소</button><button class="primary" onclick="recEnvoi('${did}',fv('v_dt'),fv('v_nt'));closeM()">저장</button></div>`)}
function recEnvoi(did,date,note,ids){DB.envois.push({id:nid(DB.envois,'V'),donateur:did,date:date||today(),note:note||'감사카드',enfants:ids||kidsOf(did).map(e=>e.id)});save(`소식 보냄: ${don(did).nom}`);render()}
function delEnvoi(id){if(!confirm('이 기록을 지울까요?'))return;DB.envois=DB.envois.filter(x=>x.id!==id);save('보낸 기록 삭제');render()}
function editDon(id){const d=id?don(id):{nom:'',type:'개인',contact:'',cycle:'월정기',montant:null,devise:'KRW',memo:'',fin:''};
 modal(`<h3>${id?'후원자 정보 수정':'새 후원자'}</h3><div class="form-grid">
 <div class="field full"><label>이름 (감사카드에 "○○님"으로 나옵니다)</label><input id="d_nom" value="${esc(d.nom)}"></div>
 <div class="field"><label>구분</label><select id="d_ty">${['개인','교회','단체'].map(x=>`<option ${d.type===x?'selected':''}>${x}</option>`).join('')}</select></div>
 <div class="field"><label>연락처</label><input id="d_ct" value="${esc(d.contact)}"></div>
 <div class="field"><label>후원 방식</label><select id="d_cy">${['월정기','연간','비정기',''].map(x=>`<option ${d.cycle===x?'selected':''}>${x}</option>`).join('')}</select></div>
 <div class="field"><label>약정액</label><input id="d_mt" type="number" value="${d.montant??''}"></div>
 <div class="field"><label>통화</label><select id="d_dv">${['KRW','EUR','USD','XOF'].map(x=>`<option ${d.devise===x?'selected':''}>${x}</option>`).join('')}</select></div>
 <div class="field"><label>후원 끝난 날 (계속이면 비움)</label><input id="d_fn" type="date" value="${esc(d.fin)}"></div>
 <div class="field full"><label>메모</label><textarea id="d_memo" style="min-height:60px">${esc(d.memo)}</textarea></div></div>
 <div class="actions">${id?`<button class="danger" style="margin-right:auto" onclick="delDon('${id}')">삭제</button>`:''}<button onclick="closeM()">취소</button><button class="primary" onclick="saveDon('${id||''}')">저장</button></div>`)}
function saveDon(id){const nom=fv('d_nom');if(!nom){alert('이름을 입력해 주세요');return}let d=id?don(id):null;if(!d){d={id:nid(DB.donateurs,'D')};DB.donateurs.push(d)}const wasOn=!d.fin;
 Object.assign(d,{nom,type:fv('d_ty'),contact:fv('d_ct'),cycle:fv('d_cy'),montant:fv('d_mt')?Number(fv('d_mt')):null,devise:fv('d_dv'),fin:fv('d_fn'),memo:fv('d_memo')});
 if(id&&wasOn&&d.fin){const ls=DB.liens.filter(l=>l.donateur===d.id&&!l.fin);if(ls.length&&confirm(`후원이 끝났습니다. 장학생 연결 ${ls.length}건도 ${fmtD(d.fin)}에 끝난 것으로 할까요?`))ls.forEach(l=>l.fin=d.fin)}
 save((id?'후원자 수정: ':'새 후원자: ')+nom);closeM();if(!id&&UI.view==='enfant')render();else go('donateur',d.id)}
function delDon(id){const d=don(id);if(!confirm(`${d.nom}의 모든 자료(연결·보낸 기록)를 지울까요?\n후원이 끝난 경우에는 "후원 끝난 날"만 적는 것을 권합니다.`))return;DB.donateurs=DB.donateurs.filter(x=>x.id!==id);DB.liens=DB.liens.filter(l=>l.donateur!==id);DB.envois=DB.envois.filter(x=>x.donateur!==id);save('후원자 삭제: '+d.nom);closeM();go('donateurs')}

/* ---------- 소식 보내기 (감사카드) ---------- */
function cardList(){if(UI.cd.ids)return UI.cd.ids.map(kid).filter(Boolean);if(UI.cd.don==='*')return DB.enfants.filter(isOn).sort(cmpNom);if(UI.cd.don)return kidsOf(UI.cd.don).map(x=>kid(x.id));return []}
const cardDon=()=>UI.cd.don&&UI.cd.don!=='*'&&DB.settings.cardDonorName!==false?don(UI.cd.don):null;
function vEnvoi(){
 const D=DB.donateurs.filter(d=>!d.fin&&kidsOf(d.id).length).sort((a,b)=>(lastSent(a.id)||'').localeCompare(lastSent(b.id)||'')||cmpKo(a,b));
 const late=D.filter(d=>daysSince(lastSent(d.id))>SINCE_WARN);const d=UI.cd.don&&UI.cd.don!=='*'?don(UI.cd.don):null,L=cardList();
 const miss=L.filter(e=>!e.photo||!lastCard(e.id).priere);
 return hd('소식 보내기')+
 `${late.length?`<div class="card"><div class="ch" style="margin-bottom:8px"><h2>소식이 필요한 후원자 <span class="muted small" style="font-weight:400">${SINCE_WARN}일 넘게 안 보냄</span></h2></div><div class="dons">${late.map(x=>`<span class="dchip" onclick="UI.cd={don:'${x.id}',ids:null};render()">${esc(x.nom)} <span class="muted small">${lastSent(x.id)?fmtD(lastSent(x.id)):'보낸 적 없음'} · ${kidsOf(x.id).length}명</span></span>`).join('')}</div></div>`:''}

  ${UI.cd.ids?`<div><span class="tag vi">${esc(L.map(e=>e.nom).join(', '))}</span> <button class="small" onclick="UI.cd={don:'',ids:null};render()">해제</button></div>`:''}
  <label style="display:flex;gap:6px;align-items:center;padding-bottom:8px"><input type="checkbox" ${DB.settings.cardDonorName!==false?'checked':''} onchange="DB.settings.cardDonorName=this.checked;save();render()"> 카드에 후원자 이름 넣기</label>

async function drawPreviews(){const box=$('#cpv');if(!box)return;for(const e of cardList()){if(!$('#cpv'))return;const c=await cardCanvas(e);const w=document.createElement('div');w.className='pv';w.appendChild(c);const r=document.createElement('div');r.className='ch';r.style.margin='8px 2px 0';r.innerHTML=`<a class="lk small" onclick="go('enfant','${e.id}')"><b>${esc(e.nom)}</b></a><button class="small" onclick="cardPNG('${e.id}')">이미지 저장</button>`;w.appendChild(r);box.appendChild(w)}}
function wrap(ctx,text,maxW){const out=[];String(text||'').split('\n').forEach(par=>{let line='';for(const ch of [...par]){const t=line+ch;if(ctx.measureText(t).width>maxW&&line){const sp=line.lastIndexOf(' ');if(sp>line.length*0.55&&ch!==' '){out.push(line.slice(0,sp));line=line.slice(sp+1)+ch}else{out.push(line);line=ch.trimStart()}}else line=t}out.push(line)});return out}
function rrect(x,X,Y,W,H,R){x.beginPath();x.moveTo(X+R,Y);x.arcTo(X+W,Y,X+W,Y+H,R);x.arcTo(X+W,Y+H,X,Y+H,R);x.arcTo(X,Y+H,X,Y,R);x.arcTo(X,Y,X+W,Y,R);x.closePath()}
async function cardCanvas(e){
 const W=1500,H=1000,c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d'),lc=lastCard(e.id),d=cardDon(),s=DB.settings;
 const F='"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif',SC='"Snell Roundhand","Brush Script MT","Segoe Script",cursive';
 const NAVY='#1e3a5f',GOLD='#e0a53a',CREAM='#f8f4ec',INK='#23262f',SUB='#5b6270';
 // 바탕
 x.fillStyle=CREAM;x.fillRect(0,0,W,H);
 x.fillStyle=NAVY;x.fillRect(0,0,W,250);
 x.fillStyle=GOLD;x.fillRect(0,250,W,8);
 // 위 띠: 인사
 x.textAlign='center';x.fillStyle='#ffffff';x.font=`92px ${SC}`;x.fillText('Merci Beaucoup',W/2+190,128);
 x.font=`bold 36px ${F}`;x.fillStyle='#f3e6c9';wrap(x,(d?d.nom+'님, ':'')+s.cardTitle,820).slice(0,2).forEach((l,i)=>x.fillText(l,W/2+190,190+i*44));
 // 사진 (흰 테두리 + 그림자, 띠에 걸치게)
 const px=80,py=70,pw=420,ph=545,u=await photoURL(e);
 x.save();x.shadowColor='rgba(0,0,0,.25)';x.shadowBlur=24;x.shadowOffsetY=8;x.fillStyle='#fff';rrect(x,px-14,py-14,pw+28,ph+28,22);x.fill();x.restore();
 x.save();rrect(x,px,py,pw,ph,14);x.clip();
 if(u){const img=await new Promise(r=>{const i=new Image();i.onload=()=>r(i);i.onerror=()=>r(null);i.src=u});if(img){const sr=Math.max(pw/img.width,ph/img.height),sw=pw/sr,sh=ph/sr;x.drawImage(img,(img.width-sw)/2,Math.max(0,(img.height-sh)*0.25),sw,sh,px,py,pw,ph)}}
 else{x.fillStyle='#e6e1d6';x.fillRect(px,py,pw,ph);x.fillStyle='#9a9286';x.font=`32px ${F}`;x.fillText('사진',px+pw/2,py+ph/2)}
 x.restore();
 // 사진 아래: 이름·생년월일·성별·학교
 const cx=px+pw/2;let y=py+ph+80;
 x.fillStyle=INK;let nfs=46;x.font=`bold ${nfs}px ${F}`;while(x.measureText(e.nom).width>pw+70&&nfs>34){nfs-=2;x.font=`bold ${nfs}px ${F}`}
 if(x.measureText(e.nom).width>pw+70){const ws=e.nom.split(' ');let a=ws.slice(0,-1).join(' '),b=ws.at(-1);x.fillText(a,cx,y);y+=nfs+6;x.fillText(b,cx,y)}else x.fillText(e.nom,cx,y);
 y+=58;x.font=`30px ${F}`;x.fillStyle=SUB;
 const sexe=e.sexe==='F'?'여':e.sexe==='M'?'남':'';
 const l1=[e.naissance?fmtD(e.naissance)+` (만 ${age(e.naissance)}세)`:'',sexe].filter(Boolean).join('  ·  ');if(l1){x.fillText(l1,cx,y);y+=44}
 const l2=[e.ecole,e.classe?e.classe+(nivKo(e.classe)?` · ${nivKo(e.classe)}`:''):''].filter(Boolean).join(' · ');
 if(l2){x.font=`27px ${F}`;let t=l2;while(x.measureText(t).width>pw+80&&t.length>4)t=t.slice(0,-1);x.fillText(t===l2?t:t+'…',cx,y)}
 // 오른쪽: 비전·기도제목 상자
 const bx=560,bw=W-bx-70;x.textAlign='left';
 const box=(Y,Hh)=>{x.save();x.fillStyle='#ffffff';x.shadowColor='rgba(30,58,95,.10)';x.shadowBlur=16;x.shadowOffsetY=4;rrect(x,bx,Y,bw,Hh,18);x.fill();x.restore();x.fillStyle=GOLD;x.fillRect(bx,Y+18,7,Hh-36)};
 const label=(t,Y)=>{x.fillStyle=NAVY;x.font=`bold 30px ${F}`;x.fillText(t,bx+34,Y)};
 // 비전
 x.font=`38px ${F}`;const pl=wrap(x,lc.projet||'—',bw-70).slice(0,2);const vh=70+pl.length*52+20;box(300,vh);label('✦ 나의 비전',300+50);x.fillStyle=INK;x.font=`bold 38px ${F}`;pl.forEach((l,i)=>x.fillText(l,bx+34,300+104+i*52));
 // 기도제목
 const py2=300+vh+28,maxH=H-110-py2;let fs=33,ll;do{x.font=`${fs}px ${F}`;ll=wrap(x,lc.priere||'—',bw-70);if(70+ll.length*fs*1.5+24<=maxH)break;fs-=2}while(fs>21);
 const ph2=Math.min(maxH,70+ll.length*fs*1.5+24);box(py2,ph2);label('🙏 기도제목',py2+50);x.fillStyle=INK;x.font=`${fs}px ${F}`;ll.forEach((l,i)=>x.fillText(l,bx+34,py2+100+i*fs*1.5));
 // 아래
 x.fillStyle=GOLD;x.fillRect(70,H-70,W-140,2);x.font=`26px ${F}`;x.fillStyle=SUB;x.textAlign='right';x.fillText(s.cardFooter,W-70,H-30);
 return c}

function vReglages(){
 return hd('설정')+`<div class="card"><h2 style="margin-bottom:8px">출력·내보내기</h2><div class="row"><button onclick="printFiches()">🖨 장학생 카드 양식 (프랑스어, 장학 중 ${DB.enfants.filter(isOn).length}명)</button><button onclick="exportCSV()">장학생 명단 엑셀로 내보내기</button></div>
 <p class="small muted" style="margin-bottom:0">카드 양식에는 이름·학교·학년·생년월일이 미리 채워지고, 비전·기도제목은 장학생이 직접 씁니다. 받은 카드는 장학생 페이지에 "카드" 기록으로 올리세요.</p></div>

function exportCSV(){const rows=[['이름','생년월일','성별','학교','학년','아버지/보호자','어머니/보호자','연락처','비전','기도제목','후원자','장학 끝난 날']];[...DB.enfants].sort(cmpNom).forEach(e=>{const lc=lastCard(e.id);rows.push([e.nom,e.naissance,e.sexe,e.ecole,e.classe,e.pere,e.mere,e.tel,lc.projet||'',lc.priere||'',donsOf(e.id).map(d=>d.nom).join(', '),e.fin])});download(`장학생_${today()}.csv`,'﻿'+rows.map(r=>r.map(c=>`"${String(c??'').replace(/"/g,'""')}"`).join(',')).join('\r\n'),'text/csv')}
function restoreBackup(file){if(!file)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(d.meta?.app!=='jangak')throw 0;if(!confirm(`이 백업(장학생 ${d.enfants.length}명)으로 바꿀까요?`))return;const old=DB?.meta?.rev||0;DB=norm(d);DB.meta.rev=Math.max(old,DB.meta.rev||0);save('백업에서 복원');render();toast('복원했습니다')}catch(e){alert('이 프로그램의 백업 파일이 아닙니다.')}};r.readAsText(file)}

/* 예전 형식(학년도별 표)을 새 형식으로 */
async function importOld(){
 let o;try{o=JSON.parse(await (await (await DIR.getFileHandle(OLDFILE)).getFile()).text())}catch(e){alert('예전 자료 파일을 읽을 수 없습니다.');return}
 if((DB.enfants.length||DB.donateurs.length)&&!confirm('지금 자료에 이전 자료를 더합니다. 같은 이름의 장학생·후원자는 건너뜁니다. 계속할까요?'))return;
 const fmt=o.meta?.format||1,cur=o.settings?.annee;const ymap={};
 const yrs=e=>{if(fmt>=2)return e.ans||{};const r={};const ys=new Set([...Object.keys(e.statut||{}),...Object.keys(e.annees||{})]);ys.forEach(y=>{r[y]=Object.assign({st:{장학중:'장학생'}[(e.statut||{})[y]]||(e.statut||{})[y]||'',ecole:e.ecole||''},(e.annees||{})[y]||{})});return r};
 const yStart=y=>y.slice(0,4)+'-10-01',yEnd=y=>(+y.slice(0,4)+1)+'-07-31';
 let nE=0,nD=0,nL=0,nH=0;
 for(const e of o.eleves||[]){if(DB.enfants.some(x=>x.nom===e.nom))continue;const ans=yrs(e),ys=Object.keys(ans).sort(),act=ys.filter(y=>ans[y].st==='장학생');const last=ys.length?ans[ys.at(-1)]:{};
  const n={id:nid(DB.enfants,'E'),nom:e.nom,naissance:e.naissance||'',sexe:e.sexe||'',ecole:last.ecole||e.ecole||'',classe:last.classe||'',pere:e.pere||'',mere:e.mere||'',tel:e.tel||'',memo:e.memo||'',photo:'',debut:act[0]?act[0].slice(0,4)+'-09-01':'',fin:(cur&&ans[cur]?.st==='장학생')?'':(act.length?yEnd(act.at(-1)):today())};
  DB.enfants.push(n);ymap[e.id]=n.id;nE++;
  const gal=(e.galerie||[]).slice();
  for(const y of ys){const r=ans[y];const fs=[];
   if(r.photo)fs.push({dir:'photos',f:r.photo});if(r.fiche)fs.push({dir:'fiches',f:r.fiche,nom:`${y} 카드`});
   gal.filter(g=>(g.label||'').startsWith(y)).forEach(g=>{fs.push({dir:g.dir,f:g.f,nom:g.label});gal.splice(gal.indexOf(g),1)});
   if(r.projet||r.priere||fs.length){DB.histoires.push({id:nid(DB.histoires,'H'),enfant:n.id,date:yStart(y),type:r.projet||r.priere?'카드':'사진',texte:r.classe?`${y} · ${[r.ecole,r.classe].filter(Boolean).join(' ')}`:'',projet:r.projet||'',priere:r.priere||'',fichiers:fs});nH++}}
  gal.forEach(g=>{DB.histoires.push({id:nid(DB.histoires,'H'),enfant:n.id,date:g.date||today(),type:'사진',texte:g.label||'',fichiers:[{dir:g.dir,f:g.f}]});nH++});
  n.photo=e.photo||[...ys].reverse().map(y=>ans[y].photo).find(Boolean)||'';
 }
 const dmap={};for(const d of o.donateurs||[]){const ex=DB.donateurs.find(x=>x.nom===d.nom);if(ex){dmap[d.id]=ex.id;continue}
  const n={id:nid(DB.donateurs,'D'),nom:d.nom,type:['개인','교회','단체'].includes(d.type)?d.type:(/교회/.test(d.nom)?'교회':/WMC|단체/.test(d.nom)?'단체':'개인'),contact:d.contact||'',cycle:d.cycle||'',montant:d.montant??null,devise:d.devise||'KRW',memo:d.memo||'',fin:''};DB.donateurs.push(n);dmap[d.id]=n.id;nD++;
  Object.values(d.ans||{}).forEach(v=>{if(v.carte)DB.envois.push({id:nid(DB.envois,'V'),donateur:n.id,date:v.carte,note:'감사카드',enfants:[]})})}
 const pairs={};(o.liens||o.matches||[]).forEach(l=>{const k=l.eleve+'|'+l.donateur;(pairs[k]=pairs[k]||[]).push(l.annee)});
 Object.entries(pairs).forEach(([k,ys])=>{const [e,d]=k.split('|');if(!ymap[e]||!dmap[d])return;ys.sort();DB.liens.push({id:nid(DB.liens,'L'),enfant:ymap[e],donateur:dmap[d],debut:ys[0].slice(0,4)+'-09-01',fin:ys.at(-1)===cur?'':yEnd(ys.at(-1))});nL++});
 Object.values(dmap).forEach(id=>{const d=don(id);if(!d.fin&&!liensOn().some(l=>l.donateur===id)){const ends=DB.liens.filter(l=>l.donateur===id).map(l=>l.fin).sort();d.fin=ends.at(-1)||today()}});
 save(`이전 자료 가져옴: 장학생 ${nE}, 후원자 ${nD}, 연결 ${nL}, 기록 ${nH}`);render();alert(`가져왔습니다.\n장학생 ${nE}명 · 후원자 ${nD}명 · 후원 연결 ${nL}건 · 기록 ${nH}건`)}

 try{const t=localStorage.getItem(KEY);if(t)DB=norm(JSON.parse(t))}catch(e){}
 if(DIR_OK){try{const h=await idbGet('dir');if(h){DIR=h;if(await h.queryPermission({mode:'readwrite'})==='granted')await useDir(h,'resume');else DSTATE='need'}}catch(e){DSTATE='error';DERR=e.message}}
